services:
  viralpulse:
    build: .
    container_name: viralpulse-ai-studio
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - MAX_UPLOAD_MB=2048
      - OPENAI_MODEL=gpt-4o-mini
      - TRANSCRIPTION_MODEL=whisper-1
    volumes:
      - viralpulse_data:/app/data
    restart: unless-stopped
volumes:
  viralpulse_data:
